[project]
name = "wb-ozon-reseller-bot"
version = "0.1.0"
description = "Production-ready Telegram-бот для автоматизации работы реселлеров Wildberries и Ozon"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Backend Team" },
]

dependencies = [
    "aiogram==3.15.0",
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "APScheduler==3.10.4",
    "python-dotenv==1.0.1",
    "orjson==3.10.12",
    "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "aiosqlite==0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
skip-string-normalization = false

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
